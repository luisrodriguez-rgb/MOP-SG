<svg width='1024' height='1024' viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'>
    <defs>
      <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#1a1518'/>
        <stop offset='100%' stop-color='#0f0d11'/>
      </linearGradient>
      <linearGradient id='redAccent' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#ff4d6d'/>
        <stop offset='50%' stop-color='#ef4444'/>
        <stop offset='100%' stop-color='#b91c1c'/>
      </linearGradient>
      <radialGradient id='halo' cx='50%' cy='50%' r='40%'>
        <stop offset='0%' stop-color='#ef4444' stop-opacity='0.3'/>
        <stop offset='100%' stop-color='#ef4444' stop-opacity='0'/>
      </radialGradient>
      <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
        <feDropShadow dx='0' dy='8' stdDeviation='18' flood-color='#ef4444' flood-opacity='0.4'/>
      </filter>
    </defs>
    <!-- Squircle container -->
    <rect x='32' y='32' width='960' height='960' rx='220' fill='url(#bgGrad)' stroke='#2a2228' stroke-width='8'/>
    <circle cx='512' cy='512' r='380' fill='url(#halo)'/>
    <!-- Outer Target Ring (White) -->
    <circle cx='512' cy='512' r='270' fill='none' stroke='#ffffff' stroke-width='32'/>
    <!-- Middle Ring (Red Accent) -->
    <circle cx='512' cy='512' r='180' fill='none' stroke='url(#redAccent)' stroke-width='28' filter='url(#glow)'/>
    <!-- Bullseye Center (Solid Red with white pip) -->
    <circle cx='512' cy='512' r='90' fill='url(#redAccent)' stroke='#ffffff' stroke-width='16' filter='url(#glow)'/>
    <circle cx='512' cy='512' r='28' fill='#ffffff'/>
    <!-- Crosshairs (Precision Reticle Marks) -->
    <line x1='512' y1='170' x2='512' y2='270' stroke='#ffffff' stroke-width='24' stroke-linecap='round'/>
    <line x1='512' y1='754' x2='512' y2='854' stroke='#ffffff' stroke-width='24' stroke-linecap='round'/>
    <line x1='170' y1='512' x2='270' y2='512' stroke='#ffffff' stroke-width='24' stroke-linecap='round'/>
    <line x1='754' y1='512' x2='854' y2='512' stroke='#ffffff' stroke-width='24' stroke-linecap='round'/>
  </svg>
<svg width='1024' height='1024' viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'>
    <defs>
      <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#1a1518'/>
        <stop offset='100%' stop-color='#0f0d11'/>
      </linearGradient>
      <linearGradient id='redAccent' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#ff4d6d'/>
        <stop offset='100%' stop-color='#dc2626'/>
      </linearGradient>
      <radialGradient id='halo' cx='50%' cy='50%' r='40%'>
        <stop offset='0%' stop-color='#ef4444' stop-opacity='0.2'/>
        <stop offset='100%' stop-color='#ef4444' stop-opacity='0'/>
      </radialGradient>
      <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
        <feDropShadow dx='0' dy='8' stdDeviation='16' flood-color='#ef4444' flood-opacity='0.3'/>
      </filter>
    </defs>
    <!-- Squircle container -->
    <rect x='32' y='32' width='960' height='960' rx='220' fill='url(#bgGrad)' stroke='#2a2228' stroke-width='8'/>
    <circle cx='512' cy='512' r='380' fill='url(#halo)'/>
    <!-- Clipboard Board -->
    <rect x='288' y='240' width='448' height='560' rx='48' fill='#1e1e24' stroke='#ffffff' stroke-width='24'/>
    <!-- Clipboard Header / Clip -->
    <rect x='400' y='180' width='224' height='100' rx='24' fill='url(#redAccent)' filter='url(#glow)' stroke='#ffffff' stroke-width='16'/>
    <circle cx='512' cy='225' r='18' fill='#ffffff'/>
    <!-- Checklist items with Red checkmarks -->
    <!-- Row 1 -->
    <circle cx='384' cy='380' r='24' fill='url(#redAccent)'/>
    <path d='M374 380 L382 388 L396 374' fill='none' stroke='#ffffff' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/>
    <rect x='440' y='368' width='210' height='24' rx='12' fill='#ffffff'/>
    <!-- Row 2 -->
    <circle cx='384' cy='480' r='24' fill='url(#redAccent)'/>
    <path d='M374 480 L382 488 L396 474' fill='none' stroke='#ffffff' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/>
    <rect x='440' y='468' width='160' height='24' rx='12' fill='#ffffff'/>
    <!-- Row 3 -->
    <circle cx='384' cy='580' r='24' fill='url(#redAccent)'/>
    <path d='M374 580 L382 588 L396 574' fill='none' stroke='#ffffff' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/>
    <rect x='440' y='568' width='185' height='24' rx='12' fill='#ffffff'/>
    <!-- Bottom progress line -->
    <rect x='360' y='672' width='304' height='18' rx='9' fill='#353540'/>
    <rect x='360' y='672' width='220' height='18' rx='9' fill='url(#redAccent)'/>
  </svg>
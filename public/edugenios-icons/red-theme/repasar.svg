<svg width='1024' height='1024' viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'>
    <defs>
      <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#1a1518'/>
        <stop offset='100%' stop-color='#0f0d11'/>
      </linearGradient>
      <linearGradient id='boltGrad' x1='20%' y1='0%' x2='80%' y2='100%'>
        <stop offset='0%' stop-color='#ff4d6d'/>
        <stop offset='50%' stop-color='#ef4444'/>
        <stop offset='100%' stop-color='#b91c1c'/>
      </linearGradient>
      <radialGradient id='halo' cx='50%' cy='50%' r='40%'>
        <stop offset='0%' stop-color='#ef4444' stop-opacity='0.25'/>
        <stop offset='100%' stop-color='#ef4444' stop-opacity='0'/>
      </radialGradient>
      <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
        <feDropShadow dx='0' dy='8' stdDeviation='18' flood-color='#ef4444' flood-opacity='0.4'/>
      </filter>
    </defs>
    <!-- Squircle container -->
    <rect x='32' y='32' width='960' height='960' rx='220' fill='url(#bgGrad)' stroke='#2a2228' stroke-width='8'/>
    <!-- Soft background glow -->
    <circle cx='512' cy='512' r='380' fill='url(#halo)'/>
    <!-- Lightning Bolt -->
    <path d='M544 192 L320 544 H480 L448 832 L704 448 H544 Z' 
          fill='url(#boltGrad)' 
          filter='url(#glow)'
          stroke='#ffffff' stroke-width='16' stroke-linejoin='round'/>
    <!-- Inner highlight -->
    <path d='M532 230 L360 520 H490 L466 740 L640 468 H520 Z' 
          fill='none' stroke='#ffccd5' stroke-width='12' stroke-linecap='round' opacity='0.6'/>
  </svg>
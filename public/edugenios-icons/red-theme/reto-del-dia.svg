<svg width='1024' height='1024' viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'>
    <defs>
      <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#1a1518'/>
        <stop offset='100%' stop-color='#0f0d11'/>
      </linearGradient>
      <linearGradient id='outerFlame' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#ff4d6d'/>
        <stop offset='50%' stop-color='#ef4444'/>
        <stop offset='100%' stop-color='#b91c1c'/>
      </linearGradient>
      <linearGradient id='innerFlame' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#fef08a'/>
        <stop offset='40%' stop-color='#f97316'/>
        <stop offset='100%' stop-color='#ef4444'/>
      </linearGradient>
      <radialGradient id='halo' cx='50%' cy='55%' r='45%'>
        <stop offset='0%' stop-color='#ef4444' stop-opacity='0.3'/>
        <stop offset='100%' stop-color='#ef4444' stop-opacity='0'/>
      </radialGradient>
      <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
        <feDropShadow dx='0' dy='10' stdDeviation='20' flood-color='#ef4444' flood-opacity='0.45'/>
      </filter>
    </defs>
    <!-- Squircle container -->
    <rect x='32' y='32' width='960' height='960' rx='220' fill='url(#bgGrad)' stroke='#2a2228' stroke-width='8'/>
    <circle cx='512' cy='540' r='380' fill='url(#halo)'/>
    <!-- Outer Flame with white contour -->
    <path d='M512 180 C440 290 320 420 320 580 C320 710 406 816 512 816 C618 816 704 710 704 580 C704 430 600 340 576 250 C540 330 490 370 490 370 C490 370 540 270 512 180 Z' 
          fill='url(#outerFlame)' 
          filter='url(#glow)'
          stroke='#ffffff' stroke-width='18' stroke-linejoin='round'/>
    <!-- Inner Flame Core -->
    <path d='M512 460 C480 520 416 590 416 670 C416 730 458 780 512 780 C566 780 608 730 608 670 C608 590 560 540 512 460 Z' 
          fill='url(#innerFlame)' stroke='#ffffff' stroke-width='8'/>
    <!-- Spark / Embers -->
    <circle cx='650' cy='320' r='14' fill='#ff4d6d' stroke='#ffffff' stroke-width='4'/>
    <circle cx='360' cy='360' r='10' fill='#f97316' stroke='#ffffff' stroke-width='3'/>
  </svg>
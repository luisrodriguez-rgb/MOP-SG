<svg width='1024' height='1024' viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'>
    <defs>
      <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#1a1518'/>
        <stop offset='100%' stop-color='#0f0d11'/>
      </linearGradient>
      <linearGradient id='redAccent' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#ff4d6d'/>
        <stop offset='100%' stop-color='#dc2626'/>
      </linearGradient>
      <radialGradient id='halo' cx='50%' cy='50%' r='40%'>
        <stop offset='0%' stop-color='#ef4444' stop-opacity='0.22'/>
        <stop offset='100%' stop-color='#ef4444' stop-opacity='0'/>
      </radialGradient>
      <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
        <feDropShadow dx='0' dy='8' stdDeviation='16' flood-color='#ef4444' flood-opacity='0.35'/>
      </filter>
    </defs>
    <!-- Squircle container -->
    <rect x='32' y='32' width='960' height='960' rx='220' fill='url(#bgGrad)' stroke='#2a2228' stroke-width='8'/>
    <circle cx='512' cy='512' r='380' fill='url(#halo)'/>
    <!-- Graduation Cap Rhombus (Top) -->
    <polygon points='512,240 784,380 512,520 240,380' 
             fill='#ffffff' stroke='#ffffff' stroke-width='16' stroke-linejoin='round'/>
    <!-- Cap under skull body -->
    <path d='M340 450 L340 600 C340 690 417 760 512 760 C607 760 684 690 684 600 L684 450 L512 538 Z' 
          fill='#1e1e26' stroke='#ffffff' stroke-width='20' stroke-linejoin='round'/>
    <!-- Cap red stripe / base accent -->
    <path d='M360 590 C390 670 448 720 512 720 C576 720 634 670 664 590' 
          fill='none' stroke='url(#redAccent)' stroke-width='22' stroke-linecap='round'/>
    <!-- Hanging Tassel (Red with badge) -->
    <path d='M512 380 L690 470 L690 650' fill='none' stroke='url(#redAccent)' stroke-width='14' stroke-linecap='round' filter='url(#glow)'/>
    <circle cx='512' cy='380' r='18' fill='url(#redAccent)'/>
    <circle cx='690' cy='660' r='26' fill='url(#redAccent)' stroke='#ffffff' stroke-width='8' filter='url(#glow)'/>
  </svg>